# NEVER edit config-version, it is used to check if the file is up to date.
config-version: 1

# Built-in placeholders that may be used by messages as features are added:
# {player}   - The target player name.
# {reason}   - A moderation reason.
# {duration} - A formatted moderation duration.
# {staff}    - The staff member name.

messages:
  prefix: '&7[&cUltimateModeration&7] &r'
  no-permission: '&cYou do not have permission to perform this command.'