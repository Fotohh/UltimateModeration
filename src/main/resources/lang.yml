# NEVER edit config-version, it is used to check if the file is up to date.
config-version: 1

# Please note that if you attempt to use placeholders in fields that do not support them, they will not work.
# For example, you cannot use {note-index} in the no-permission message, as it is not relevant to that message.
# If you use a placeholder in a message where it is not applicable, it will be displayed as-is.
# If you use a placeholder in a message where it is applicable, it will be replaced with the actual value.
# This applies to all placeholders in the messages section.
# Built-in placeholders that are used by messages as features are added:
# {player}   - The target player name.
# {note-index} - The index of a note.
# {note-author} - The author of a note.
# {note-content} - The content of a note.
# {note-max-length} - The maximum length of a note, as defined in the configuration file.
# {value} - Usually represents numerical inputs that aren't numbers. Ex: hi is not a valid number.
# {reason} - The reason for a kick/ban/warn ect.

messages:
  no-permission: '&cYou do not have permission to perform this command.'
  player-not-found: '&c{player} was not found or does not exist.'
  no-delete-message-index: '&cYou must specify a message index to delete.'
  note-deleted: '&aDeleted note {note-index} for {player}.'
  note-added: '&aAdded note for {player}.'
  invalid-note-index: '&c{note-index} is not a valid note index for {player}.'
  note-must-have-content: '&cYou must provide content for the note.'
  sender-not-valid: '&cYou cannot execute this command.'
  content-too-long: '&cThe content is too long. Please keep it under {note-max-length} characters.'
  no-notes: '&c{player} has no notes.'
  note-list-header: '&6Notes for {player}:'
  note-list-entry: '&7[{note-index}] Author: {note-author}, &f{note-content}'
  note-command-usage: '&cUsage: /note <add|list|delete> <player>'
  note-add-command-usage: '&cUsage: /note add <player> <content>'
  note-delete-command-usage: '&cUsage: /note delete <player> <index>'
  sender-not-player: '&cOnly players can execute this command!'
  warn-command-usage: '&cUsage: /warn <add|list|delete> <player>'
  warn-add-command-usage: '&cUsage: /warn add <player> <reason>'
  warn-delete-command-usage: '&cUsage: /warn delete <player> <index>'
  warn-must-have-reason: '&cYou must specify a reason for warning {player}.'
  invalid-number: '&c{value} is not a valid number.'
  invalid-warn-index: '&c{value} is not a valid warn index for {player}.'
  warn-deleted: '&aDeleted warn {value} for {player}.' #value represents the index of the player warn
  warn-list-command-usage: '&cUsage: /warn list <player>'
  no-warns: '&c{player} has no warns.'
  warn-list-header: '&6Warns for {player}:'
  warn-list-entry: '&7[{value}] Author: {warn-author}, &f{warn-content}'
  warn-added: '&aSuccessfully warned {player}.'
  kick-command-usage: '&cUsage: /kick <player> <reason>'
  kick-must-have-reason: '&cYou must include a reason.'
  player-not-online: '&cThat player is not online.'
  kicked-player: '&aYou have kicked {player} for {reason}.'
  mute-usage: '&cUsage: /mute <player> <reason>'
  mute-must-have-reason: '&cYou must include a reason.'
  muted-player: '&aMuted {player} for {reason}.'
